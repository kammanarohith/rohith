<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Result</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .correct { background: #c8e6c9; padding: 6px; border-radius: 6px; }
    .wrong { background: #ffcdd2; padding: 6px; border-radius: 6px; }
    .your-answer { font-weight: bold; color: #1976d2; }
    .question-card { margin-bottom: 25px; padding: 15px; border: 1px solid #ddd; border-radius: 10px; background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Test Results</h1>
    <div id="resultBox"></div>
  </div>

  <script>
    const result = JSON.parse(localStorage.getItem("studentResult"));
    const questions = JSON.parse(localStorage.getItem("testQuestions"));

    if (!result || !questions) {
      document.getElementById("resultBox").innerHTML = "<p>No result found.</p>";
    } else {
      let correctCount = 0;
      const resultBox = document.getElementById("resultBox");

      resultBox.innerHTML = `
        <p><strong>Name:</strong> ${result.name}</p>
        <p><strong>Reg. No:</strong> ${result.regNo}</p>
        ${
          result.forced
            ? "<p style='color:red'><strong>Test ended due to tab switch or suspicious activity.</strong></p>"
            : ""
        }
        <hr>
      `;

      questions.forEach((q, idx) => {
        const correctAns = q.correct;
        const studentAns = result.answers[idx] || [];
        const isCorrect =
          studentAns.length === correctAns.length &&
          studentAns.every((val) => correctAns.includes(val));

        if (isCorrect) correctCount++;

        let html = `<div class="question-card">`;
        html += `<h3>Q${idx + 1}. ${q.question}</h3>`;

        q.options.forEach((opt, i) => {
          const isSelected = studentAns.includes(i);
          const isRight = correctAns.includes(i);
          const cls = isRight
            ? "correct"
            : isSelected
            ? "wrong"
            : "";
          html += `<p class="${cls}">${opt}${
            isSelected ? " <span class='your-answer'>(Your answer)</span>" : ""
          }</p>`;
        });

        html += `</div>`;
        resultBox.innerHTML += html;
      });

      resultBox.innerHTML += `
        <h2>✅ Score: ${correctCount} / ${questions.length}</h2>
      `;
    }
  </script>
</body>
</html>
