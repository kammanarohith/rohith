<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Online Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📝 Test Creator</h1>
    <p class="subtitle">Set up your custom test with questions, options, and answers</p>

    <div class="card">
      <label>📌 Number of Questions</label>
      <input type="number" id="numQuestions" placeholder="e.g., 5" min="1">
    </div>

    <div class="card">
      <label>⏳ Time Duration (minutes)</label>
      <input type="number" id="testTime" placeholder="e.g., 10" min="1">
    </div>

    <button id="nextBtn">Next: Add Questions</button>

    <form id="questionForm" class="question-form" style="display:none;"></form>

    <button id="saveTestBtn" style="display:none;">✅ Save & Go to Student Page</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
